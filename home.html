<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedScan — Valley fever triage for Arizona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html{scroll-behavior:smooth}
  body{margin:0;background:#f4f3f0;color:#16181b;font-family:"Libre Franklin",Helvetica,Arial,sans-serif;font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;text-wrap:pretty}
  *{box-sizing:border-box}
  a{color:#10395e;text-decoration:none}
  a:hover{color:#16181b;text-decoration:underline;text-underline-offset:2px}
  h1,h2,h3,h4,p,ul,li{margin:0;padding:0}
  ul{list-style:none}
  button,input,textarea{font-family:inherit}
  @keyframes msPulse{0%{opacity:1}50%{opacity:.28}100%{opacity:1}}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================================================
   MedScan — vanilla port of the MedScan Site design component.
   Two-page SPA (home / stories) + a login-gated CT triage checker.
   The checker runs entirely client-side; your scan never leaves the
   browser. Sign-in state comes from the Flask session via /api/me.
   Scoring weights are illustrative — verify against CDC / IDSA /
   Valley Fever Center for Excellence before clinical use.
   ============================================================ */

const MAX_MB = 60;

function fmtBytes(n){
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(0) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const QUESTIONS = [
  {id:'duration', q:'How long have you had the cough?',
   sub:'Bacterial pneumonia is usually acute — days. Valley fever tends to drag on for weeks.',
   opts:[{v:'lt1',t:'Under 1 week',pts:0},{v:'1to3',t:'1 to 3 weeks',pts:1},{v:'3to6',t:'3 to 6 weeks',pts:2},{v:'gt6',t:'More than 6 weeks',pts:2}]},
  {id:'abx', q:'Have you taken antibiotics for this — and did they help?',
   sub:'The single most useful question. Bacterial pneumonia should improve within two to three days.',
   opts:[{v:'none',t:'Haven’t taken any',pts:0},{v:'helped',t:'Took them and they helped',pts:0},{v:'nohelp',t:'Took a full course, no improvement',pts:3}]},
  {id:'constitutional', q:'Any night sweats, unusual fatigue, or unexplained weight loss?',
   sub:'A slow, wearing-down pattern fits valley fever more than a quick bacterial illness.',
   opts:[{v:'no',t:'No',pts:0},{v:'yes',t:'Yes, one or more',pts:1}]},
  {id:'nodosum', q:'Any new painful red bumps on your shins?',
   sub:'Called desert rheumatism. Painful shin nodules are strongly associated with valley fever in an endemic area.',
   opts:[{v:'no',t:'No',pts:0},{v:'yes',t:'Yes',pts:3}]},
  {id:'exposure', q:'Do you live in — or have you traveled to — Arizona, Central California, or Nevada in the past 3 months?',
   sub:'Valley fever comes from desert dust. Without exposure to the endemic region it is very unlikely.',
   opts:[{v:'yes',t:'Yes',pts:2},{v:'no',t:'No',pts:0}]},
  {id:'risk', q:'Do any of these apply to you?',
   sub:'Pregnancy, diabetes, a weakened immune system, or certain ancestries carry higher risk of the infection spreading. This affects urgency, not whether you have it.',
   opts:[{v:'no',t:'None of these',pts:0},{v:'yes',t:'One or more applies',pts:0,urgency:true}]},
  {id:'emergency', q:'Right now, do you have a severe headache with a stiff neck, confusion, or trouble breathing?',
   sub:'These can signal a medical emergency and change what you should do next.',
   opts:[{v:'no',t:'No',pts:0},{v:'yes',t:'Yes',pts:0,emergency:true}]},
];

const REASON_TEXT = {
  duration_1to3:'Your cough has lasted more than a week — longer than typical bacterial pneumonia.',
  duration_3to6:'A cough lasting three to six weeks runs longer than bacterial pneumonia usually does.',
  duration_gt6:'A cough past six weeks is well beyond a typical bacterial course.',
  abx_nohelp:'You finished a course of antibiotics with no improvement. Antibiotics do nothing to a fungus.',
  constitutional_yes:'Night sweats, fatigue, or weight loss fit a slower, systemic infection.',
  nodosum_yes:'Painful shin nodules (erythema nodosum) are strongly associated with valley fever here.',
  exposure_yes:'You have been in the endemic desert region where the fungus lives.',
};

const QUOTE = 'I worked with a knowledgeable physician from my previous job, who advised me what tests to request from my primary care provider… It was a month later when I was properly diagnosed through lab tests.';

const FACTS = [
  {n:'~60%', text:'of all U.S. valley fever cases are diagnosed in Arizona.', src:'CDC / AZDHS'},
  {n:'~1,100', text:'deaths a year are attributed to the infection, and likely more.', src:'CIDRAP, Univ. of Minnesota'},
  {n:'5–10%', text:'of people who get valley fever develop serious or long-term lung problems.', src:'CDC'},
  {n:'~1%', text:'have the infection spread beyond the lungs to other parts of the body.', src:'CDC'},
];

const SPREAD = [
  {num:'01', title:'Bones and joints', body:'Any part of the skeleton can be involved, but the vertebrae are affected disproportionately. Paraspinal abscess is a possible complication; the tibia, femur, skull, hands, and feet are also common sites.'},
  {num:'02', title:'Central nervous system', body:'Spread to the brain or spinal cord is the most dangerous form. A severe headache with a stiff neck or new confusion during a lingering respiratory illness is an emergency.'},
  {num:'03', title:'Skin', body:'Lesions and non-healing sores away from the original site can be the first visible sign that the infection has left the lungs.'},
  {num:'04', title:'Why the delay matters', body:'Chest radiography is fast, widely available, and useful for staging and follow-up — but its findings are nonspecific and variable, so imaging alone rarely raises the question in time.'},
];

const OPT_BASE = 'display:flex;align-items:center;gap:13px;text-align:left;width:100%;padding:15px 17px;border-radius:2px;font-size:15.5px;cursor:pointer;';
const NAV_ON = "background:none;border:0;padding:0 0 2px;cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:600;color:#16181b;border-bottom:2px solid #16181b";
const NAV_OFF = "background:none;border:0;padding:0 0 2px;cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:500;color:#454951;border-bottom:2px solid transparent";
const MONO = "'IBM Plex Mono',monospace";
const SERIF = "Newsreader,Georgia,serif";

const state = {
  page:'home', step:0, answers:{}, stop:null, copied:false,
  file:null, previewUrl:null, dragging:false, fileError:null,
  authed:false, _scrollTo:null,
  providersZip:'', providers:null, provLoading:false, provError:null, provSource:null,
};

/* ---------- scoring + clinician document ---------- */
function score(){
  const A = state.answers, reasons = [];
  let total = 0, urgency = false;
  QUESTIONS.forEach(Q=>{
    const v = A[Q.id]; if(!v) return;
    const o = Q.opts.find(x=>x.v===v); if(!o) return;
    if(o.urgency) urgency = true;
    if(o.pts>0){ total += o.pts; reasons.push({pts:'+'+o.pts, text: REASON_TEXT[Q.id+'_'+v] || 'Contributing factor.'}); }
  });
  return {total, reasons, urgency, exposed: A.exposure==='yes'};
}
function docText(){
  const A = state.answers;
  const dur = {lt1:'under 1 week','1to3':'1–3 weeks','3to6':'3–6 weeks',gt6:'more than 6 weeks'}[A.duration] || 'not stated';
  const abx = {none:'No antibiotics taken.',helped:'Antibiotics taken, symptoms improved.',nohelp:'Completed a course of antibiotics with no improvement.'}[A.abx] || '';
  const F = state.file;
  const findings = F
    ? 'Patient has a chest CT on file (' + F.name + ', ' + fmtBytes(F.size) + '), not machine-analyzed. Imaging findings per the radiologist report.'
    : 'No imaging attached by patient.';
  return [
    'REQUEST FOR COCCIDIOIDOMYCOSIS (VALLEY FEVER) TESTING',
    'Prepared by the patient from their own records.',
    '',
    'SYMPTOM SUMMARY',
    'Cough duration: ' + dur + '. ' + abx,
    (A.constitutional==='yes' ? 'Reports night sweats / fatigue / weight loss.' : 'No constitutional symptoms reported.'),
    (A.nodosum==='yes' ? 'Reports painful shin nodules, possible erythema nodosum.' : ''),
    '',
    'ENDEMIC EXPOSURE',
    (A.exposure==='yes' ? 'Lives in or recently traveled to the endemic Southwest.' : 'No known exposure.') + (A.risk==='yes' ? ' Reports a higher-risk factor for dissemination (e.g. pregnancy, diabetes, immunocompromise).' : ''),
    '',
    'IMAGING',
    findings,
    '',
    'REQUESTED',
    'Please consider Coccidioides serology (EIA IgM and IgG). If negative and clinical',
    'suspicion remains, consider immunodiffusion and a complement fixation titer.',
    'Serology may be falsely negative in the first 1–3 weeks; if symptoms persist,',
    'consider repeating in 2–3 weeks. A positive result may warrant ID referral.',
    '',
    'Generated with MedScan, a rule-based triage aid. Not a diagnosis; not clinician-reviewed.',
    'Does not rule out tuberculosis or malignancy.',
  ].join('\n');
}

/* ---------- static chrome ---------- */
function topbar(){
  return `<div style="background:#16181b;color:#c9ccd1">
    <div style="max-width:1180px;margin:0 auto;padding:9px 32px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;font-family:${MONO};font-size:11px;letter-spacing:.07em;text-transform:uppercase">
      <span>Research preview — not a diagnostic device</span>
      <span style="color:#7f858e">Phoenix, Arizona · built for the endemic Southwest</span>
    </div>
  </div>`;
}
function header(home){
  const auth = state.authed
    ? `<a href="/logout" style="font-size:14.5px;font-weight:500;color:#454951">Log out</a>`
    : `<a href="/login" style="font-size:14.5px;font-weight:600;color:#10395e">Sign in</a>`;
  return `<header style="position:sticky;top:0;z-index:60;background:rgba(244,243,240,.93);backdrop-filter:blur(10px);border-bottom:1px solid #dedcd6">
    <div style="max-width:1180px;margin:0 auto;padding:0 32px;height:70px;display:flex;align-items:center;justify-content:space-between;gap:24px">
      <button data-act="goHome" style="display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:#16181b">
        <span style="font-weight:700;font-size:19px;letter-spacing:.10em;text-transform:uppercase">MedScan</span>
        <span style="font-family:${MONO};font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#797d85;border-left:1px solid #dedcd6;padding-left:10px">Valley fever triage</span>
      </button>
      <nav style="display:flex;align-items:center;gap:26px">
        <button data-act="goHome" style="${home?NAV_ON:NAV_OFF}">Check a report</button>
        <button data-act="goStories" style="${home?NAV_OFF:NAV_ON}">Patient stories</button>
        <button data-act="goAbout" style="background:none;border:0;padding:0;cursor:pointer;font-family:inherit;color:#454951;font-size:14.5px;font-weight:500">About</button>
        ${auth}
      </nav>
    </div>
  </header>`;
}
function footer(){
  return `<footer style="background:#16181b;color:#a4aab2">
    <div style="max-width:1180px;margin:0 auto;padding:56px 32px 44px">
      <div style="display:grid;grid-template-columns:1.4fr 1.1fr 1fr;gap:40px">
        <div>
          <div style="display:flex;align-items:baseline;gap:10px">
            <span style="font-weight:700;font-size:19px;letter-spacing:.1em;text-transform:uppercase;color:#f7f6f3">MedScan</span>
            <span style="font-family:${MONO};font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#7f858e;border-left:1px solid #3a3f45;padding-left:10px">Valley fever triage</span>
          </div>
          <p style="margin-top:14px;font-size:14px;color:#7f858e;max-width:38ch">A patient-first triage aid for the Arizona desert. Built to get one question asked in the exam room.</p>
        </div>
        <div>
          <h4 style="font-family:${MONO};font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#6a7078;font-weight:400">References</h4>
          <ul style="margin-top:14px;display:grid;gap:9px;font-size:14px">
            <li><sup style="font-family:${MONO};font-size:10px;color:#6a7078">1</sup> <a href="https://www.cdc.gov/valley-fever/" target="_blank" rel="noopener" style="color:#c9ccd1">CDC — Valley Fever</a></li>
            <li><sup style="font-family:${MONO};font-size:10px;color:#6a7078">2</sup> <a href="https://vfce.arizona.edu/" target="_blank" rel="noopener" style="color:#c9ccd1">Valley Fever Center for Excellence</a></li>
            <li><sup style="font-family:${MONO};font-size:10px;color:#6a7078">3</sup> <a href="https://www.azdhs.gov/" target="_blank" rel="noopener" style="color:#c9ccd1">AZ Dept. of Health Services</a></li>
            <li><sup style="font-family:${MONO};font-size:10px;color:#6a7078">4</sup> <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7432779/" target="_blank" rel="noopener" style="color:#c9ccd1">Coccidioidomycosis imaging review (PMC7432779)</a></li>
            <li><sup style="font-family:${MONO};font-size:10px;color:#6a7078">5</sup> <span style="color:#c9ccd1">CIDRAP, University of Minnesota — surveillance undercount</span></li>
          </ul>
        </div>
        <div>
          <h4 style="font-family:${MONO};font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#6a7078;font-weight:400">Pages</h4>
          <ul style="margin-top:14px;display:grid;gap:9px;font-size:14px">
            <li><button data-act="goHome" style="background:none;border:0;padding:0;color:#c9ccd1;font-size:14px;cursor:pointer;font-family:inherit">Check a report</button></li>
            <li><button data-act="goStories" style="background:none;border:0;padding:0;color:#c9ccd1;font-size:14px;cursor:pointer;font-family:inherit">Patient stories</button></li>
          </ul>
        </div>
      </div>
      <p style="margin-top:40px;padding-top:22px;border-top:1px solid #2b2f34;font-size:13px;color:#7f858e;max-width:88ch"><strong style="color:#c9ccd1">Not medical advice.</strong> MedScan is an educational triage aid, not a diagnosis, and does not replace a licensed clinician. It does not detect or rule out cancer, tuberculosis, or other conditions that look similar on imaging. If you are seriously ill or worsening, seek care now. Mortality and case-count figures are the estimates cited by the sources above; confirm current numbers before quoting them.</p>
    </div>
  </footer>`;
}

/* ---------- home page ---------- */
function heroSection(){
  return `<section style="max-width:1180px;margin:0 auto;padding:56px 32px 12px">
    <div style="max-width:64ch">
      <div style="font-family:${MONO};font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#10395e;display:flex;align-items:center;gap:9px">
        <span style="width:6px;height:6px;background:#10395e;display:inline-block"></span>Upload a chest CT scan
      </div>
      <h1 style="font-family:${SERIF};font-weight:400;font-size:clamp(38px,4.6vw,58px);line-height:1.05;letter-spacing:-.02em;margin-top:18px">A cough that won&rsquo;t quit isn&rsquo;t always pneumonia.</h1>
      <p style="font-size:19px;line-height:1.55;color:#454951;margin-top:20px">In Arizona, weeks of coughing and a chest scan read as pneumonia can be valley fever &mdash; a fungal infection that antibiotics cannot touch. Sign in, upload your CT, answer seven questions, and MedScan tells you whether to request the one inexpensive blood test that settles it.</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:34px;border-top:1px solid #16181b">
      <div style="padding:16px 24px 0 0;border-right:1px solid #dedcd6">
        <div style="font-family:${MONO};font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:#797d85">Takes</div>
        <p style="margin-top:4px;font-size:15px;color:#454951">About a minute, once you&rsquo;re signed in. A free account keeps each check yours.</p>
      </div>
      <div style="padding:16px 24px;border-right:1px solid #dedcd6">
        <div style="font-family:${MONO};font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:#797d85">Privacy</div>
        <p style="margin-top:4px;font-size:15px;color:#454951">Your scan opens in your browser. Nothing is uploaded, stored, or logged.</p>
      </div>
      <div style="padding:16px 0 0 24px">
        <div style="font-family:${MONO};font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:#797d85">Method</div>
        <p style="margin-top:4px;font-size:15px;color:#454951">Stated rules, shown in plain English. The CT model is in training, not yet reading scans.</p>
      </div>
    </div>
  </section>`;
}

function barsHtml(active){
  let out = '';
  for(let i=0;i<8;i++){
    const done = i<active, cur = i===active;
    out += `<div style="flex:1;height:4px;background:${done?'#10395e':(cur?'#16181b':'#e6e4de')}"></div>`;
  }
  return out;
}

function dropStyle(){
  return 'display:flex;align-items:center;justify-content:center;width:100%;min-height:170px;margin-top:20px;padding:24px;border-radius:2px;cursor:pointer;'
    + (state.dragging
      ? 'border:1px solid #10395e;background:#e9eef2;'
      : 'border:1px dashed #c8c5bd;background:repeating-linear-gradient(135deg,#fbfaf8 0 8px,#f4f3f0 8px 16px);');
}
function fileEmpty(){
  return `<div style="text-align:center">
    <div style="font-family:${MONO};font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#454951">Drop your CT file here</div>
    <div style="margin-top:9px;font-size:14px;color:#797d85">or <span style="color:#10395e;text-decoration:underline;text-underline-offset:3px">choose a file from your device</span></div>
    <div style="margin-top:14px;font-family:${MONO};font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:#a8a59d">.dcm · .dicom · .png · .jpg &nbsp;|&nbsp; stays on this device</div>
  </div>`;
}
function fileFilled(){
  const F = state.file;
  const thumbInner = state.previewUrl
    ? `width:100%;height:100%;background-image:url("${state.previewUrl}");background-size:contain;background-position:center;background-repeat:no-repeat`
    : 'width:100%;height:100%';
  const thumbBody = state.previewUrl
    ? `<div role="img" aria-label="Uploaded CT scan" style="${thumbInner}"></div>`
    : `<span style="font-family:${MONO};font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#6a7078;text-align:center;line-height:1.8">DICOM<br>no browser preview</span>`;
  const chipBase = `display:inline-flex;align-items:center;gap:7px;font-family:${MONO};font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:2px;`;
  const chip = chipBase + 'background:#f5f0e2;color:#8b6a1c;border:1px solid #e2d8bd';
  return `<div style="display:flex;gap:20px;align-items:center;width:100%">
    <div style="flex:none;width:104px;height:104px;background:#0c0e10;border:1px solid #1e2226;display:flex;align-items:center;justify-content:center;overflow:hidden">${thumbBody}</div>
    <div style="flex:1;min-width:0">
      <div style="font-family:${MONO};font-size:13px;color:#16181b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(F.name)}</div>
      <div style="margin-top:6px;font-family:${MONO};font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#797d85">${esc(fmtBytes(F.size) + ' · ' + (F.type || 'DICOM'))}</div>
      <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center">
        <span style="${chip}">Analysis — queued for model release</span>
        <button data-act="clearFile" style="background:none;border:0;padding:0;color:#797d85;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer">Remove</button>
      </div>
    </div>
  </div>`;
}
function lockedStage(){
  return `<div>
    <div style="font-family:${MONO};font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:#98362a">Locked · sign in to begin</div>
    <h2 style="font-family:${SERIF};font-weight:400;font-size:28px;letter-spacing:-.01em;margin-top:10px">Sign in to upload your scan</h2>
    <p style="margin-top:7px;font-size:15px;color:#797d85;max-width:62ch">To keep every check private to you, MedScan asks you to sign in before you upload a scan or answer the questions. It&rsquo;s free &mdash; and your scan still opens in your browser and is never sent to a server.</p>
    <div style="margin-top:24px;padding-top:22px;border-top:1px solid #dedcd6;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center">
      <span style="font-family:${MONO};font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#a8a59d">The checker unlocks once you&rsquo;re signed in</span>
      <a href="/login" style="border:0;background:#16181b;color:#fff;font-size:14.5px;font-weight:700;padding:12px 22px;border-radius:3px;text-decoration:none">Sign in or create an account</a>
    </div>
  </div>`;
}
function reportStage(){
  const modelNotice = state.fileError ? esc(state.fileError)
    : 'Our chest-CT model is still in training, so nothing here reads your image yet. Attaching the scan simply records that you have one; the assessment below comes entirely from your answers.';
  return `<div>
    <div style="font-family:${MONO};font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:#10395e">Step 01 of 08 · optional</div>
    <h2 style="font-family:${SERIF};font-weight:400;font-size:28px;letter-spacing:-.01em;margin-top:10px">Upload your chest CT scan</h2>
    <p style="margin-top:7px;font-size:15px;color:#797d85;max-width:62ch">Drop in a DICOM file or an exported image from your CT. The file is opened on this device and never sent to a server. Our imaging model is still in training, so today the scan is attached for your clinician and the assessment below comes from your answers.</p>
    <label id="dropzone" for="ctfile" style="${dropStyle()}">${state.file ? fileFilled() : fileEmpty()}</label>
    <input id="ctfile" type="file" accept=".dcm,.dicom,image/*" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
    <div style="margin-top:16px;border-left:2px solid #8b6a1c;background:#f5f0e2;padding:14px 16px;font-size:14px;color:#454951;max-width:74ch">${modelNotice}</div>
    <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:26px;padding-top:22px;border-top:1px solid #dedcd6">
      <span style="font-family:${MONO};font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#a8a59d">No scan? Skip &mdash; the questions still work</span>
      <div style="display:flex;gap:10px">
        <button data-act="skip" style="border:1px solid #dedcd6;background:#fff;color:#454951;font-size:14.5px;font-weight:600;padding:12px 20px;border-radius:3px;cursor:pointer">Skip this</button>
        <button data-act="commit" style="border:0;background:#16181b;color:#fff;font-size:14.5px;font-weight:700;padding:12px 22px;border-radius:3px;cursor:pointer">Continue</button>
      </div>
    </div>
  </div>`;
}
function questionStage(){
  const Q = QUESTIONS[state.step-1];
  const chosen = state.answers[Q.id];
  const stepLabel = 'Step 0'+(state.step+1)+' of 08';
  const opts = Q.opts.map(o=>{
    const sel = chosen===o.v;
    const style = OPT_BASE + (sel ? 'background:#e9eef2;border:1px solid #10395e;color:#16181b;' : 'background:#fbfaf8;border:1px solid #dedcd6;color:#454951;');
    const dot = 'flex:none;width:11px;height:11px;border-radius:50%;border:1px solid '+(sel?'#10395e':'#c8c5bd')+';background:'+(sel?'#10395e':'#fff');
    return `<button data-act="pick" data-qid="${Q.id}" data-val="${o.v}" style="${style}"><span style="${dot}"></span><span>${esc(o.t)}</span></button>`;
  }).join('');
  const nextLabel = state.step===QUESTIONS.length ? 'See my result' : 'Next';
  const nextStyle = 'border:0;border-radius:3px;font-size:14.5px;font-weight:700;padding:12px 22px;' + (chosen ? 'background:#16181b;color:#fff;cursor:pointer;' : 'background:#e6e4de;color:#a8a59d;cursor:not-allowed;');
  return `<div>
    <div style="font-family:${MONO};font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:#10395e">${stepLabel}</div>
    <h2 style="font-family:${SERIF};font-weight:400;font-size:28px;line-height:1.18;letter-spacing:-.01em;margin-top:10px;max-width:34ch">${esc(Q.q)}</h2>
    <p style="margin-top:8px;font-size:15px;color:#797d85;max-width:62ch">${esc(Q.sub)}</p>
    <div style="display:grid;gap:9px;margin-top:22px">${opts}</div>
    <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:26px;padding-top:22px;border-top:1px solid #dedcd6">
      <button data-act="back" style="background:none;border:0;padding:0;color:#797d85;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer">&larr; Back</button>
      <button data-act="next" style="${nextStyle}">${nextLabel}</button>
    </div>
  </div>`;
}
function stopStage(){
  const em = state.stop==='emergency';
  const kicker = em ? 'Stop — emergency' : 'Stop — beyond triage';
  const headline = em ? 'Please seek emergency care now.' : 'This is beyond what a triage tool should handle.';
  const bodyTxt = em
    ? 'A severe headache with a stiff neck, new confusion, or trouble breathing alongside a lingering respiratory illness can be a medical emergency — including spread of valley fever to the brain or spinal cord. This is not something to triage online.'
    : 'Your report mentions a finding such as a mass, suspected malignancy, or pneumothorax that needs a clinician’s eyes promptly, not a website. Contact your physician or seek care without waiting.';
  const note = em
    ? 'Call 911 or go to the nearest emergency department. Tell them how long you have been ill and that you may have been exposed to valley fever.'
    : 'MedScan stops here on purpose. It will not weigh valley-fever odds against a finding that could be more serious.';
  return `<div>
    <div style="background:#f6efed;border:1px solid #e3ccc7;border-radius:2px;padding:24px 26px">
      <div style="font-family:${MONO};font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#98362a">${kicker}</div>
      <div style="font-family:${SERIF};font-size:27px;line-height:1.2;margin-top:8px">${headline}</div>
      <p style="margin-top:10px;font-size:15.5px;color:#454951;max-width:64ch">${bodyTxt}</p>
    </div>
    <div style="margin-top:20px;border-left:2px solid #98362a;background:#f6efed;padding:15px 17px;font-size:14px;color:#454951;max-width:70ch">${note}</div>
    <div style="margin-top:26px;padding-top:22px;border-top:1px solid #dedcd6">
      <button data-act="restart" style="background:none;border:0;padding:0;color:#797d85;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer">&larr; Start over</button>
    </div>
  </div>`;
}
function providersResult(){
  if(state.provLoading) return `<p style="margin-top:16px;font-family:${MONO};font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#a8a59d">Searching the NPPES registry…</p>`;
  if(state.provError) return `<p style="margin-top:16px;font-size:14px;color:#98362a">${esc(state.provError)}</p>`;
  if(!state.providers) return '';
  if(!state.providers.length) return `<p style="margin-top:16px;font-size:14px;color:#797d85">No listings found for that ZIP. Try a nearby ZIP, or ask your primary-care clinic for an infectious-disease referral.</p>`;
  const rows = state.providers.map(p=>{
    const addr = [p.address, [p.city,p.state].filter(Boolean).join(', '), p.zip].filter(Boolean).join(' · ');
    const phone = p.phone ? `<a href="tel:${esc(String(p.phone).replace(/[^0-9]/g,''))}" style="font-family:${MONO};font-size:13px;color:#10395e">${esc(p.phone)}</a>` : '';
    return `<div style="display:grid;grid-template-columns:1fr auto;gap:12px;padding:15px 0;border-bottom:1px solid #dedcd6;align-items:start">
      <div>
        <div style="font-size:15.5px;font-weight:600;color:#16181b">${esc(p.name)}</div>
        <div style="margin-top:3px;font-family:${MONO};font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#797d85">${esc(p.specialty||'')}</div>
        ${addr?`<div style="margin-top:6px;font-size:13.5px;color:#797d85">${esc(addr)}</div>`:''}
      </div>
      <div style="text-align:right;white-space:nowrap">${phone}</div>
    </div>`;
  }).join('');
  const src = state.provSource==='fallback'
    ? 'Live registry lookup was unavailable — here are Arizona clinics and resources to start with.'
    : 'Source: the federal NPPES NPI registry.';
  return `<div style="margin-top:14px">${rows}
    <p style="margin-top:14px;font-family:${MONO};font-size:11px;letter-spacing:.04em;line-height:1.7;color:#a8a59d">${src} For the blood draw itself, Sonora Quest Laboratories has patient service centers across Arizona.</p>
  </div>`;
}
function providersBlock(){
  return `<div style="margin-top:30px;border-top:1px solid #16181b;padding-top:22px">
    <div style="font-family:${MONO};font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#797d85">Find a clinician near you</div>
    <p style="margin-top:8px;font-size:14.5px;color:#454951;max-width:66ch">Enter your ZIP to pull infectious-disease and pulmonary clinicians in your area from the federal NPPES registry. Your scan and answers stay in your browser &mdash; only the ZIP is sent, to look up nearby clinics.</p>
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px">
      <input id="provzip" inputmode="numeric" maxlength="5" placeholder="e.g. 85004" value="${esc(state.providersZip||'')}" style="font-family:${MONO};font-size:14px;padding:11px 13px;border:1px solid #dedcd6;border-radius:2px;background:#fbfaf8;width:150px">
      <button data-act="findProviders" style="border:0;background:#16181b;color:#fff;font-size:14px;font-weight:700;padding:11px 20px;border-radius:3px;cursor:pointer">${state.provLoading?'Searching…':'Find clinicians'}</button>
    </div>
    ${providersResult()}
  </div>`;
}
function resultStage(){
  const r = score();
  let band, headline, blurb, showDoc = false, accent = '#10395e', bg = '#eceff2', bd = '#cfdae3';
  if(!r.exposed){
    band = 'Unlikely';
    headline = 'Valley fever looks unlikely for you.';
    blurb = 'Without exposure to the desert region where the fungus lives, valley fever is improbable. If your cough persists or worsens, still see a doctor — this tool screens for one specific cause only.';
  } else if(r.total>=8){
    band = 'Ask this week'; showDoc = true; accent = '#98362a'; bg = '#f6efed'; bd = '#e3ccc7';
    headline = 'Worth asking your doctor about — soon.';
    blurb = 'Several signals here line up with valley fever. That does not mean you have it, but it is a strong reason to request a Coccidioides serology this week. Bring the page below to your appointment.';
  } else if(r.total>=4){
    band = 'Worth asking about'; showDoc = true; accent = '#8b6a1c'; bg = '#f5f0e2'; bd = '#e2d8bd';
    headline = 'Worth raising at your next visit.';
    blurb = 'There is enough here to bring up valley fever with your clinician and ask whether a serology test makes sense. Copy the page below to make that conversation easy.';
  } else {
    band = 'Low signal';
    headline = 'Only a weak signal right now.';
    blurb = 'Not much here points specifically to valley fever, but you are in the endemic area. If symptoms drag on or worsen, mention valley fever and ask whether a test is warranted.';
  }
  const reasonRows = r.reasons.map(x=>`
    <div style="display:grid;grid-template-columns:52px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid #dedcd6">
      <span style="font-family:${MONO};font-size:13px;color:#10395e">${esc(x.pts)}</span>
      <span style="font-size:14.5px;color:#454951">${esc(x.text)}</span>
    </div>`).join('');
  const reasonsBlock = r.reasons.length ? `
    <div style="margin-top:30px">
      <div style="font-family:${MONO};font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#797d85">The reasoning, line by line</div>
      <div style="margin-top:12px">${reasonRows}</div>
    </div>` : '';
  const urgencyBlock = (r.urgency && showDoc) ? `
    <div style="margin-top:20px;border-left:2px solid #8b6a1c;background:#f5f0e2;padding:15px 17px;font-size:14px;color:#454951;max-width:70ch">Because you noted a higher-risk factor, say so explicitly and ask whether a complement fixation (CF) titer is warranted to watch for the infection spreading.</div>` : '';
  const docBlock = showDoc ? `
    <div style="margin-top:30px;border:1px solid #16181b;background:#fff">
      <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid #dedcd6">
        <span style="font-family:${MONO};font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:#16181b">Page for your clinician</span>
        <button data-act="copy" style="border:1px solid #16181b;background:#fff;color:#16181b;font-size:13px;font-weight:700;padding:8px 14px;border-radius:3px;cursor:pointer">${state.copied?'Copied':'Copy text'}</button>
      </div>
      <pre style="margin:0;padding:22px 20px;font-family:${MONO};font-size:12.5px;line-height:1.75;color:#16181b;white-space:pre-wrap">${esc(docText())}</pre>
    </div>` : '';
  return `<div>
    <div style="background:${bg};border:1px solid ${bd};border-left:3px solid ${accent};border-radius:2px;padding:24px 26px">
      <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:baseline">
        <span style="font-family:${MONO};font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#10395e">${band}</span>
        <span style="font-family:${MONO};font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#797d85">signal score ${r.total}</span>
      </div>
      <div style="font-family:${SERIF};font-size:29px;line-height:1.18;letter-spacing:-.01em;margin-top:10px;max-width:30ch">${headline}</div>
      <p style="margin-top:11px;font-size:15.5px;color:#454951;max-width:66ch">${blurb}</p>
    </div>
    ${reasonsBlock}
    ${urgencyBlock}
    <div style="margin-top:20px;border-left:2px solid #10395e;background:#eceff2;padding:15px 17px;font-size:14px;color:#454951;max-width:70ch">This is a screening aid, not a diagnosis. Valley fever can resemble tuberculosis or lung cancer on imaging &mdash; a low score here does not rule those out, and serology can be falsely negative in the first one to three weeks. Follow your clinician&rsquo;s judgment.</div>
    ${docBlock}
    ${providersBlock()}
    <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;margin-top:26px;padding-top:22px;border-top:1px solid #dedcd6">
      <button data-act="restart" style="background:none;border:0;padding:0;color:#797d85;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer">&larr; Start over</button>
      <button data-act="goStories" style="border:1px solid #16181b;background:#fff;color:#16181b;font-size:14px;font-weight:600;padding:11px 18px;border-radius:3px;cursor:pointer">Read patient stories &rarr;</button>
    </div>
  </div>`;
}
function checkerSection(){
  const S = state;
  const stage = !S.authed ? 'locked' : (S.stop ? 'stop' : (S.step===0 ? 'report' : (S.step<=QUESTIONS.length ? 'q' : 'result')));
  const active = !S.authed ? -1 : (S.stop ? 8 : S.step);
  let body;
  if(stage==='locked') body = lockedStage();
  else if(stage==='report') body = reportStage();
  else if(stage==='q') body = questionStage();
  else if(stage==='stop') body = stopStage();
  else body = resultStage();
  return `<section id="check" style="max-width:1180px;margin:0 auto;padding:36px 32px 72px;scroll-margin-top:80px">
    <div style="border:1px solid #16181b;border-radius:3px;background:#fff">
      <div style="display:flex;gap:4px">${barsHtml(active)}</div>
      <div style="padding:34px 36px 36px">${body}</div>
    </div>
  </section>`;
}
function aboutSection(){
  return `<section id="about" style="background:#fff;border-top:1px solid #dedcd6;border-bottom:1px solid #dedcd6;scroll-margin-top:80px">
    <div style="max-width:1180px;margin:0 auto;padding:60px 32px;display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:start">
      <div>
        <div style="font-family:${MONO};font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#797d85">What this is</div>
        <h2 style="font-family:${SERIF};font-weight:400;font-size:clamp(26px,3vw,34px);line-height:1.12;letter-spacing:-.02em;margin-top:14px">One question, asked at the right moment.</h2>
        <p style="margin-top:16px;font-size:16px;color:#454951">Valley fever starts when someone breathes in microscopic fungal spores from disturbed dirt &mdash; something dust storms, dry spells, monsoon winds, and construction all stir up. On a chest film it looks like ordinary pneumonia, so it gets treated as bacterial, and antibiotics do nothing to a fungus.</p>
        <p style="margin-top:14px;font-size:15px;color:#797d85">Roughly two thirds of U.S. cases are diagnosed in Arizona.<sup style="font-family:${MONO};font-size:10px;color:#10395e">1</sup> Chest radiography is usually the first study ordered and it is genuinely useful for staging and follow-up &mdash; but its findings are nonspecific and variable.<sup style="font-family:${MONO};font-size:10px;color:#10395e">4</sup> The test that settles the question is a blood draw. MedScan exists to get one sentence said in the exam room: <em>could this be valley fever?</em></p>
      </div>
      <div>
        <div style="display:grid;grid-template-columns:150px 1fr;gap:0 20px">
          <div style="font-family:${MONO};font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#10395e;padding-top:18px;border-top:1px solid #16181b">What it does</div>
          <div style="padding:18px 0;border-top:1px solid #16181b;font-size:15px;color:#454951">Takes your chest CT, weighs seven history questions, and hands you a copyable test request written in clinical language. The CT model that will read the image is in training; the questions carry the assessment today.</div>
          <div style="font-family:${MONO};font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#98362a;padding-top:18px;border-top:1px solid #dedcd6">What it does not</div>
          <div style="padding:18px 0;border-top:1px solid #dedcd6;font-size:15px;color:#454951">Diagnose, treat, or replace a clinician. It cannot rule out tuberculosis, cancer, or anything else that looks similar on a scan.</div>
          <div style="font-family:${MONO};font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8b6a1c;padding-top:18px;border-top:1px solid #dedcd6">Coming next</div>
          <div style="padding:18px 0;border-top:1px solid #dedcd6;font-size:15px;color:#454951">A chest-CT model is in training now and will be integrated once validated. It will read the image itself rather than the text report. No model output is used for diagnosis today.</div>
        </div>
      </div>
    </div>
  </section>`;
}
function homePage(){ return heroSection() + checkerSection() + aboutSection(); }

/* ---------- stories page ---------- */
function storiesPage(){
  const facts = FACTS.map((f,i)=>{
    const cell = 'padding:24px '+(i===3?'0':'28px')+' 24px '+(i===0?'0':'28px')+';border-top:1px solid #16181b;'+(i<3?'border-right:1px solid #dedcd6;':'');
    return `<div style="${cell}">
      <div style="font-family:${SERIF};font-size:clamp(30px,3.2vw,40px);line-height:1;letter-spacing:-.02em">${f.n}</div>
      <p style="margin-top:11px;font-size:14.5px;color:#454951">${f.text}</p>
      <div style="margin-top:10px;font-family:${MONO};font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:#a8a59d">${f.src}</div>
    </div>`;
  }).join('');
  const spread = SPREAD.map((s,i)=>{
    const numStyle = 'font-family:'+MONO+';font-size:12px;color:'+(i===1?'#98362a':'#10395e')+';padding-top:18px;border-top:1px solid '+(i===0?'#16181b':'#dedcd6');
    const bodyStyle = 'padding:18px 0 '+(i===3?'0':'16px')+';border-top:1px solid '+(i===0?'#16181b':'#dedcd6');
    return `<div style="display:grid;grid-template-columns:44px 1fr;gap:0 20px">
      <div style="${numStyle}">${s.num}</div>
      <div style="${bodyStyle}">
        <h3 style="font-size:17px;font-weight:600">${s.title}</h3>
        <p style="margin-top:5px;font-size:14.5px;color:#797d85">${s.body}</p>
      </div>
    </div>`;
  }).join('');
  return `<div>
    <section style="max-width:1180px;margin:0 auto;padding:56px 32px 44px">
      <div style="max-width:62ch">
        <div style="font-family:${MONO};font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#10395e;display:flex;align-items:center;gap:9px">
          <span style="width:6px;height:6px;background:#10395e;display:inline-block"></span>Patient stories &amp; what the numbers show
        </div>
        <h1 style="font-family:${SERIF};font-weight:400;font-size:clamp(36px,4.4vw,54px);line-height:1.05;letter-spacing:-.02em;margin-top:18px">Getting diagnosed took medical knowledge most people don&rsquo;t have.</h1>
        <p style="font-size:18.5px;line-height:1.55;color:#454951;margin-top:20px">Arizona gets a lot of dust storms, and dust carries spores. Valley fever is one of the infections that follows &mdash; roughly 60 percent of all U.S. cases are diagnosed here.<sup style="font-family:${MONO};font-size:11px;color:#10395e">1</sup> It kills an estimated 1,100 people a year, and almost certainly more than that, because national surveillance never counts the people who are undiagnosed, misdiagnosed, or who never sought care at all.<sup style="font-family:${MONO};font-size:11px;color:#10395e">5</sup></p>
      </div>
    </section>

    <section style="background:#0c0e10;color:#c9ccd1">
      <div style="max-width:1180px;margin:0 auto;padding:60px 32px">
        <div style="font-family:${MONO};font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#8b9099">Testimony · Arizona resident</div>
        <blockquote style="margin:22px 0 0;font-family:${SERIF};font-weight:400;font-style:italic;font-size:clamp(26px,3.4vw,40px);line-height:1.28;letter-spacing:-.01em;color:#f7f6f3;max-width:30ch">&ldquo;${QUOTE}&rdquo;</blockquote>
        <div style="display:flex;flex-wrap:wrap;gap:28px;justify-content:space-between;align-items:flex-end;margin-top:30px;padding-top:20px;border-top:1px solid #262a2f">
          <div style="font-family:${MONO};font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7f858e">Via the <a href="https://vfce.arizona.edu/" target="_blank" rel="noopener" style="color:#c9ccd1">Valley Fever Center for Excellence</a><sup style="font-size:10px;color:#6a7078">2</sup></div>
          <p style="font-size:15px;color:#a4aab2;max-width:44ch">They were diagnosed because they happened to know a physician who could tell them which tests to ask for. That is the gap this tool is trying to close &mdash; the knowledge, not the lab work.</p>
        </div>
      </div>
    </section>

    <section style="background:#fff;border-top:1px solid #dedcd6;border-bottom:1px solid #dedcd6">
      <div style="max-width:1180px;margin:0 auto;padding:56px 32px">
        <div style="font-family:${MONO};font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#797d85">What the numbers show</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:26px">${facts}</div>
      </div>
    </section>

    <section style="max-width:1180px;margin:0 auto;padding:56px 32px">
      <div style="display:grid;grid-template-columns:.85fr 1.15fr;gap:56px;align-items:start">
        <div>
          <div style="font-family:${MONO};font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#797d85">When it leaves the lungs</div>
          <h2 style="font-family:${SERIF};font-weight:400;font-size:clamp(26px,3vw,34px);line-height:1.12;letter-spacing:-.02em;margin-top:14px">Rare, but this is what late diagnosis risks.</h2>
          <p style="margin-top:16px;font-size:16px;color:#454951">About one in a hundred infections spreads beyond the lungs. It is uncommon enough to be missed and serious enough that timing matters.<sup style="font-family:${MONO};font-size:10px;color:#10395e">3</sup></p>
          <p style="margin-top:14px;font-size:15px;color:#797d85">Skeletal spread can involve any part of the skeleton but disproportionately affects the vertebrae, where paraspinal abscess is a possible complication. Other common sites are the tibia, femur, skull, and the bones of the hands and feet.<sup style="font-family:${MONO};font-size:10px;color:#10395e">4</sup></p>
        </div>
        <div>${spread}</div>
      </div>
    </section>

    <section style="max-width:1180px;margin:0 auto;padding:56px 32px 72px;border-top:1px solid #dedcd6">
      <div style="font-family:${MONO};font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#797d85">Recognise the pattern</div>
      <h2 style="font-family:${SERIF};font-weight:400;font-size:clamp(26px,3vw,34px);line-height:1.12;letter-spacing:-.02em;margin-top:12px;max-width:34ch">Four things nearly every account has in common.</h2>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:32px;margin-top:30px">
        <div style="border-top:1px solid #16181b;padding-top:16px"><div style="font-family:${MONO};font-size:11px;color:#98362a">01</div><p style="margin-top:8px;font-size:15px;color:#454951">A cough that ran well past the two or three weeks a bacterial infection takes.</p></div>
        <div style="border-top:1px solid #16181b;padding-top:16px"><div style="font-family:${MONO};font-size:11px;color:#98362a">02</div><p style="margin-top:8px;font-size:15px;color:#454951">At least one full course of antibiotics that changed nothing.</p></div>
        <div style="border-top:1px solid #16181b;padding-top:16px"><div style="font-family:${MONO};font-size:11px;color:#98362a">03</div><p style="margin-top:8px;font-size:15px;color:#454951">Fatigue and night sweats treated as separate, unrelated complaints.</p></div>
        <div style="border-top:1px solid #16181b;padding-top:16px"><div style="font-family:${MONO};font-size:11px;color:#98362a">04</div><p style="margin-top:8px;font-size:15px;color:#454951">A serology ordered only after the patient, or someone they knew, raised it.</p></div>
      </div>
      <div style="margin-top:36px;border:1px solid #16181b;background:#fff;padding:26px 28px;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center">
        <div style="max-width:54ch">
          <h3 style="font-family:${SERIF};font-weight:400;font-size:24px">If that sounds like your last few months</h3>
          <p style="margin-top:8px;font-size:15px;color:#797d85">The check takes about a minute, and nothing you upload leaves your browser.</p>
        </div>
        <button data-act="goCheck" style="border:0;background:#16181b;color:#fff;font-size:14.5px;font-weight:700;padding:13px 22px;border-radius:3px;cursor:pointer">Check my report &rarr;</button>
      </div>
    </section>
  </div>`;
}

/* ---------- render + events ---------- */
function render(){
  const home = state.page==='home';
  document.getElementById('root').innerHTML = topbar() + header(home) + (home ? homePage() : storiesPage()) + footer();
  bind();
  if(state._scrollTo){
    const target = state._scrollTo; state._scrollTo = null;
    setTimeout(()=>{
      if(target==='top'){ window.scrollTo({top:0}); return; }
      const el = document.getElementById(target);
      if(el){ const y = el.getBoundingClientRect().top + window.pageYOffset - 78; window.scrollTo({top:y, behavior:'smooth'}); }
    }, 40);
  }
}
function takeFile(file){
  if(!file) return;
  if(file.size > MAX_MB*1024*1024){
    state.fileError = 'That file is larger than ' + MAX_MB + ' MB. Export a single series or a flattened image.';
    render(); return;
  }
  if(state.previewUrl) URL.revokeObjectURL(state.previewUrl);
  const isImg = /^image\//.test(file.type || '');
  state.file = {name:file.name, size:file.size, type:file.type || ''};
  state.previewUrl = isImg ? URL.createObjectURL(file) : null;
  state.dragging = false; state.fileError = null;
  render();
}
function onAct(e){
  const act = e.currentTarget.getAttribute('data-act');
  switch(act){
    case 'goHome': state.page='home'; state._scrollTo='top'; render(); break;
    case 'goStories': state.page='stories'; state._scrollTo='top'; render(); break;
    case 'goAbout': state.page='home'; state._scrollTo='about'; render(); break;
    case 'goCheck': state.page='home'; state._scrollTo='check'; render(); break;
    case 'skip': state.step=1; render(); break;
    case 'commit': state.step=1; render(); break;
    case 'back': state.step=Math.max(0, state.step-1); render(); break;
    case 'pick': {
      const qid=e.currentTarget.getAttribute('data-qid'), val=e.currentTarget.getAttribute('data-val');
      state.answers = Object.assign({}, state.answers, {[qid]:val}); render(); break;
    }
    case 'next': {
      const Q = QUESTIONS[state.step-1];
      const chosen = state.answers[Q.id];
      if(!chosen) return;
      const o = Q.opts.find(x=>x.v===chosen);
      if(o && o.emergency){ state.stop='emergency'; render(); return; }
      state.step = state.step+1; render(); break;
    }
    case 'restart': {
      if(state.previewUrl) URL.revokeObjectURL(state.previewUrl);
      Object.assign(state, {step:0, answers:{}, stop:null, copied:false, file:null, previewUrl:null, fileError:null,
        providersZip:'', providers:null, provLoading:false, provError:null, provSource:null});
      render(); break;
    }
    case 'findProviders': {
      const el = document.getElementById('provzip');
      const zip = ((el && el.value) || '').trim();
      if(!/^\d{5}$/.test(zip)){ state.provError='Please enter a 5-digit ZIP code.'; state.providers=null; render(); return; }
      state.providersZip=zip; state.provError=null; state.provLoading=true; state.providers=null; render();
      fetch('/api/providers?zip='+encodeURIComponent(zip), {cache:'no-store'})
        .then(r=>r.json())
        .then(j=>{ state.provLoading=false; state.provSource=j.source; state.providers=j.providers||[]; render(); })
        .catch(()=>{ state.provLoading=false; state.provError='Could not reach the provider registry. Please try again.'; render(); });
      break;
    }
    case 'clearFile': {
      e.preventDefault(); e.stopPropagation();
      if(state.previewUrl) URL.revokeObjectURL(state.previewUrl);
      state.file=null; state.previewUrl=null; state.fileError=null; render(); break;
    }
    case 'copy': {
      if(navigator.clipboard) navigator.clipboard.writeText(docText());
      state.copied=true; render();
      setTimeout(()=>{ state.copied=false; render(); }, 1800); break;
    }
  }
}
function bind(){
  const root = document.getElementById('root');
  root.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click', onAct));
  const inp = document.getElementById('ctfile');
  if(inp) inp.addEventListener('change', e=>takeFile(e.target.files && e.target.files[0]));
  const dz = document.getElementById('dropzone');
  if(dz){
    dz.addEventListener('dragover', e=>{ e.preventDefault(); if(!state.dragging){ state.dragging=true; render(); } });
    dz.addEventListener('dragleave', e=>{ e.preventDefault(); if(state.dragging){ state.dragging=false; render(); } });
    dz.addEventListener('drop', e=>{ e.preventDefault(); state.dragging=false; const dt=e.dataTransfer; takeFile(dt && dt.files && dt.files[0]); });
  }
}

/* ---------- init: read login state, then unlock ---------- */
async function init(){
  render();
  try{
    const r = await fetch('/api/me', {cache:'no-store'});
    const j = await r.json();
    state.authed = !!j.logged_in;
  }catch(e){ state.authed = false; }
  render();
  if(location.hash==='#check' && state.authed){ state._scrollTo='check'; render(); }
}
init();
</script>
